[package]
name = "boxx"
version = "0.1.0"
edition = "2024"

[features]
integration = []

[dependencies]
clap = { version = "4", features = ["derive"] }
httparse = "1"
libc = "0.2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dependencies.smoltcp]
version = "0.12"
default-features = false
features = [
  "std",
  "medium-ethernet",
  "proto-ipv4",
  "proto-ipv6",
  "socket-tcp",
  "socket-udp",
  "socket-raw",
]
